# 项目相关配置
project-info:
  # 名称
  name: @project.artifactId@
  # 版本
  version: @project.version@
  # 描述
  description: @project.description@
  # 版权年份
  copyrightYear: 2025
  # 实例演示开关
  demoEnabled: false
  # 获取ip地址开关
  addressEnabled: true
  # 缓存懒加载
  cacheLazy: false

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8091
  servlet:
    # 应用的访问路径
    context-path: /
    session:
      #配置会话超时
      timeout: 2000s
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: -1
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    # 请求超时，默认是不超时
    no-request-timeout: -1
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 200
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 400


# Spring配置
spring:
  application:
    name: ${project-info.name}
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
      # 排除热加载资源
      exclude: config/**,cert/**

  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
    async:
      request-timeout: 2000s
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false


# security配置
security:
  # 排除路径
  excludes:
    # 静态资源
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    # 公共路径
    - /favicon.ico
    - /error
    # swagger 文档配置
    - /*/api-docs
    - /*/api-docs/**
    - /swagger**/**
    # actuator 监控配置
    - /actuator
    - /actuator/**
    - /payPage/**
    - /static/**
    # jmreport 页面
    - /jmreport/**

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 不支持多包, 如有需要可在注解配置 或 提升扫包等级
  # 例如 com.**.**.mapper
  #mapperPackage: com.yumu.**.mapper
  # 对应的 XML 文件位置
  #mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  #typeAliasesPackage: com.yumu.**.domain
  # 启动时是否检查 MyBatis XML 文件的存在，默认不检查
  checkConfigLocation: false
  configuration:
    # 自动驼峰命名规则（camel case）映射
    mapUnderscoreToCamelCase: true
    # MyBatis 自动映射策略
    # NONE：不启用 PARTIAL：只对非嵌套 resultMap 自动映射 FULL：对所有 resultMap 自动映射
    autoMappingBehavior: PARTIAL
    # MyBatis 自动映射时未知列或未知属性处理策
    # NONE：不做处理 WARNING：打印相关警告 FAILING：抛出异常和详细信息
    autoMappingUnknownColumnBehavior: NONE
    # 更详细的日志输出 会有性能损耗 org.apache.ibatis.logging.stdout.StdOutImpl
    # 关闭日志记录 (可单纯使用 p6spy 分析) org.apache.ibatis.logging.nologging.NoLoggingImpl
    # 默认日志输出 org.apache.ibatis.logging.slf4j.Slf4jImpl
    logImpl: org.apache.ibatis.logging.slf4j.Slf4jImpl
#    logImpl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    # fetch大小
    default-fetch-size: 10000
  global-config:
    # 是否打印 Logo banner
    banner: true
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      idType: ASSIGN_ID
      # 逻辑已删除值
      logicDeleteValue: 2
      # 逻辑未删除值
      logicNotDeleteValue: 0
      # 字段验证策略之 insert,在 insert 的时候的字段验证策略
      # IGNORED 忽略 NOT_NULL 非NULL NOT_EMPTY 非空 DEFAULT 默认 NEVER 不加入 SQL
      insertStrategy: NOT_NULL
      # 字段验证策略之 update,在 update 的时候的字段验证策略
      updateStrategy: NOT_NULL
      # 字段验证策略之 select,在 select 的时候的字段验证策略既 wrapper 根据内部 entity 生成的 where 条件
      where-strategy: NOT_NULL

# Swagger配置
swagger:
  info:
    # 标题
    title: '管理系统_接口API文档'
    # 描述
    description: '管理具体包括 系统模块...'
    # 版本
    version: '版本号: ${project-info.version}'
    # 作者信息
    contact:
      name: Kevin Liu
      email: lrkkevin@163.com
      url:
  components:
    # 鉴权方式配置
    security-schemes:
      apiKey:
        type: APIKEY
        in: HEADER
        name: ${sa-token.token-name}

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: false
    # 修改api-docs路径
    path: /v3/api-docs
  swagger-ui:
    # 开启Swagger UI界面
    enabled: true
    # 修改Swagger UI路径
    path:
    # 持久化认证数据
    persistAuthorization: true
    # alpha 表示按字母顺序排序,默认情况下没什么顺序
    tags-sorter: alpha
    #method根据 HTTP 请求的类型（顺序如下：DELETE > GET > POST > PUT）排序,默认情况下，Controller 代码里面，你写的是什么顺序,swagger 就给你展示什么顺序。
    operations-sorter: method
  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 1.系统模块
      displayName: 1.系统模块
      packages-to-scan: com.jdyx.web
      packagesToExclude: com.jdyx.web.controller.common
      pathsToExclude: /system/dict/**,/system/config/**,/system/notice/**,/monitor/cache/**
    - group: 2.dolphin模块
      displayName: 2.dolphin模块
      packages-to-scan: com.jdyx.dolphin.controller


--- # Actuator 监控端点的配置项
management:
  info:
    git:
      mode: full
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/measure/sys-actuator.log

# 全局线程池相关配置
thread-pool:
  # 是否开启线程池
  enabled: true
  # 队列最大长度
  queueCapacity: 128
  # 线程池维护线程所允许的空闲时间
  keepAliveSeconds: 300
